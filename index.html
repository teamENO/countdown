<!DOCTYPE html>
<html lang="ja" style="background:transparent !important;">
<head>
  <meta charset="UTF-8">
  <title>Countdown</title>
  <style>
    html, body {
      margin:0;
      padding:0;
      background:transparent !important;
      font-family:system-ui,sans-serif;
      overflow:hidden;
      color:#000 !important;
    }

    #time {
      text-align:center;
      padding:10px;
      color:#000 !important;
      font-weight:600;
    }

    /* PC向け（大きめ） */
    #time {
      font-size:2rem;
    }

    /* スマホ向け（自動で縮小） */
    @media (max-width:480px) {
      #time {
        font-size:1.4rem;
      }
    }

    /* さらに小さい画面向け */
    @media (max-width:360px) {
      #time {
        font-size:1.2rem;
      }
    }
  </style>
</head>
<body style="background:transparent !important; color:#000 !important;">
  <div id="time">--</div>

  <script>
    const params = new URLSearchParams(location.search);
    const dateParam = params.get("date");

    const targetDate = dateParam
      ? new Date(dateParam)
      : new Date("2026-12-31T23:59:59");

    function update(){
      const now = new Date();
      const diff = targetDate - now;

      if(diff <= 0){
        time.textContent = "終了";
        return;
      }

      const d = Math.floor(diff/(1000*60*60*24));
      const h = Math.floor(diff%(1000*60*60*24)/(1000*60*60));
      const m = Math.floor(diff%(1000*60*60)/(1000*60));
      const s = Math.floor(diff%(1000*60)/1000);

      time.textContent = `${d}日 ${h}時間 ${m}分 ${s}秒`;
    }

    update();
    setInterval(update,1000);
  </script>
</body>
</html>
